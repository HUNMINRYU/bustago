name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 수동 트리거 (Actions 탭에서 Run workflow 클릭)
  workflow_dispatch:

# 동일 ref에 대해 새 푸시가 오면 이전 실행 취소 (비용/시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # backend/config.py의 _warn_missing_keys 경고는 RuntimeWarning이라
      # pytest에서 silence하지 않는 한 출력됨. 테스트는 mock이라 키 값은 무관.
      GJ_BIS_API_KEY: dummy_ci_key
      # responses 라이브러리가 GJ_BIS_BASE_URL 그대로 매칭하므로 기본값 사용.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install hardware test deps (cv2 / numpy < 2)
        # hardware/tests/*는 cv2 합성 영상·이미지를 생성. ultralytics는 lazy import라
        # 단위 테스트 자체에는 불필요 (predict_fn 주입 / 함수 분리 패턴).
        run: |
          python -m pip install "numpy<2" "opencv-python<4.10"

      - name: Verify environment
        run: |
          python -c "import cv2, numpy, flask, sklearn, responses, pytest; \
            print('cv2', cv2.__version__, 'numpy', numpy.__version__, \
                  'flask', flask.__version__, 'pytest', pytest.__version__)"

      - name: Run pytest (mock-only, no external network)
        run: |
          python -m pytest -m "not network" -v --tb=short

      - name: Pytest summary
        if: always()
        run: |
          echo "::group::Final test result"
          python -m pytest -m "not network" --collect-only -q 2>&1 | tail -5
          echo "::endgroup::"
