<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSTAGO 운영자 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
</head>
<body>
  <header class="dashboard-header">
    <div class="header-content">
      <h1>BUSTAGO 운영자 대시보드</h1>
      <span class="last-updated" id="last-updated"></span>
      <div class="header-controls">
        <select id="station-filter">
          <option value="all">전체 정류장</option>
          <!-- Populated dynamically from /api/stations -->
        </select>
        <select id="period-filter">
          <option value="today">오늘</option>
          <option value="week">이번 주</option>
          <option value="month">이번 달</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Loading Overlay -->
  <div class="loading-overlay-fullscreen" id="loading-overlay">
    <div class="spinner"></div>
    <span>데이터 로딩 중...</span>
  </div>

  <main class="dashboard-main">
    <!-- Summary Cards -->
    <section class="summary-row">
      <div class="summary-card">
        <span class="summary-value" id="avg-congestion">1.4</span>
        <span class="summary-label">평균 혼잡도</span>
      </div>
      <div class="summary-card">
        <span class="summary-value" id="full-count">12</span>
        <span class="summary-label">만차 횟수</span>
      </div>
      <div class="summary-card">
        <span class="summary-value" id="peak-hour">08시</span>
        <span class="summary-label">피크 시간대</span>
      </div>
      <div class="summary-card">
        <span class="summary-value" id="station-count">4</span>
        <span class="summary-label">모니터링 정류장</span>
      </div>
    </section>

    <!-- Realtime Counting Panel -->
    <section class="panel counting-panel" id="counting-panel">
      <h2>실시간 카운팅 <span class="live-badge">LIVE</span></h2>
      <div class="counting-grid">
        <div class="counting-card">
          <span class="counting-value" id="cnt-waiting">—</span>
          <span class="counting-label">현재 대기 인원</span>
        </div>
        <div class="counting-card">
          <span class="counting-value" id="cnt-in">—</span>
          <span class="counting-label">총 진입 (IN)</span>
        </div>
        <div class="counting-card">
          <span class="counting-value" id="cnt-board">—</span>
          <span class="counting-label">총 탑승 (BOARD)</span>
        </div>
        <div class="counting-card status-card">
          <span class="status-dot" id="jetson-dot"></span>
          <span class="counting-label" id="jetson-status">확인 중...</span>
        </div>
      </div>
      <p class="counting-timestamp" id="counting-ts"></p>
    </section>

    <!-- Chart + Map Row -->
    <section class="chart-map-row">
      <div class="panel chart-panel">
        <h2>시간대별 혼잡도 추이</h2>
        <canvas id="congestion-chart"></canvas>
      </div>
      <div class="panel map-panel">
        <h2>정류장 지도</h2>
        <div id="station-map"></div>
      </div>
    </section>

    <!-- Congestion Distribution Doughnut -->
    <section class="panel doughnut-panel">
      <h2>혼잡도 등급 분포</h2>
      <div class="doughnut-wrapper">
        <canvas id="congestion-doughnut"></canvas>
      </div>
    </section>

    <!-- Statistics Table -->
    <section class="panel table-panel">
      <h2>노선별 통계</h2>
      <p class="table-scroll-hint">표를 좌우로 스크롤하여 전체 내용을 확인하세요</p>
      <div class="table-wrapper">
        <table id="stats-table">
          <thead>
            <tr>
              <th>정류장</th>
              <th>평균 혼잡도</th>
              <th>만차 횟수</th>
              <th>피크 시간</th>
              <th>현재 상태</th>
            </tr>
          </thead>
          <tbody id="stats-tbody">
            <!-- Filled by JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="../shared/api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
